name: Build EmsaProxy iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Active Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App & Network Extension (Unsigned)
        run: |
          xcodebuild clean build \
            -project EmsaProxy.xcodeproj \
            -scheme EmsaProxy \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="build"

      - name: Package into IPA Archive
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/EmsaProxy.app Payload/
          mkdir -p Payload/EmsaProxy.app/PlugIns
          if [ -d build/Release-iphoneos/EmsaProxyTunnel.appex ]; then
            cp -R build/Release-iphoneos/EmsaProxyTunnel.appex Payload/EmsaProxy.app/PlugIns/
          fi
          zip -r -9 EmsaProxy.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmsaProxy-IPA
          path: EmsaProxy.ipa
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "EmsaProxy iOS v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ### EmsaProxy iOS (Unsigned IPA)
            - **Platform:** iOS 16.0+
            - **Core:** Apple Network Extension (`NEPacketTunnelProvider` on 198.18.0.1)
            - **Features:** Modular Configuration Engine, MITM Hostname Manager, JavaScript Scripting Runtime
            - **Installation:** Sideload via Sideloadly, AltStore, or TrollStore.
          files: EmsaProxy.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
