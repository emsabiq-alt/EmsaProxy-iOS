name: EmsaProxy
options:
  bundleIdPrefix: com.emsapro
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  EmsaProxy:
    type: application
    platform: iOS
    sources:
      - path: EmsaProxy
    info:
      path: EmsaProxy/Info.plist
      properties:
        CFBundleDisplayName: "EmsaProxy"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: EmsaProxy/EmsaProxy.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.emsapro.EmsaProxy
    dependencies:
      - target: EmsaProxyTunnel

  EmsaProxyTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: EmsaProxyTunnel
    info:
      path: EmsaProxyTunnel/Info.plist
      properties:
        CFBundleDisplayName: "EmsaProxyTunnel"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: EmsaProxyTunnel.PacketTunnelProvider
    entitlements:
      path: EmsaProxyTunnel/EmsaProxyTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.emsapro.EmsaProxy
